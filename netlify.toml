# Netlify deployment configuration for Olson Pro Wash (Astro static build)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Astro sitemap + robots live in /dist after build; no plugin needed.

# ---------------------------------------------------------------------------
# Security + caching headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Hashed assets emitted by Astro can be cached aggressively.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# ---------------------------------------------------------------------------
# Pretty-URL redirects
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/quote"
  to = "/contact"
  status = 301

# Astro outputs dist/404.html — Netlify serves it automatically for unmatched routes.
