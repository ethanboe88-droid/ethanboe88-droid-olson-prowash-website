# Netlify deployment — Olson Pro Wash (Astro static build)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, must-revalidate"

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/quote"
  to = "/contact/"
  status = 301

# Old blog slugs from before the Wisconsin -> Lake Stevens relocation.
# Point them at their current equivalents so inbound links and Google keep working.
[[redirects]]
  from = "/blog/best-pressure-washing-services-northwest-wisconsin"
  to = "/blog/best-pressure-washing-services-lake-stevens-wa/"
  status = 301
[[redirects]]
  from = "/blog/best-pressure-washing-services-northwest-wisconsin/"
  to = "/blog/best-pressure-washing-services-lake-stevens-wa/"
  status = 301
[[redirects]]
  from = "/blog/how-often-should-you-pressure-wash-your-home"
  to = "/blog/how-often-pressure-wash-home-pacific-northwest/"
  status = 301
[[redirects]]
  from = "/blog/how-often-should-you-pressure-wash-your-home/"
  to = "/blog/how-often-pressure-wash-home-pacific-northwest/"
  status = 301
[[redirects]]
  from = "/blog/soft-wash-vs-pressure-wash"
  to = "/blog/soft-wash-vs-pressure-wash-washington-home/"
  status = 301
[[redirects]]
  from = "/blog/soft-wash-vs-pressure-wash/"
  to = "/blog/soft-wash-vs-pressure-wash-washington-home/"
  status = 301

# dist/404.html is served automatically by Netlify for unmatched routes.
